apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale-ingress-operator
  namespace: headscale-ingress-operator
  labels:
    app.kubernetes.io/name: headscale-ingress-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headscale-ingress-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headscale-ingress-operator
    spec:
      serviceAccountName: headscale-ingress-operator
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: headscale-ingress-operator:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          args:
            - --headscale-namespace=headscale
            - --records-configmap=headscale-extra-records
            - --records-key=extra-records.json
            - --allowed-zones=cluster.example
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
