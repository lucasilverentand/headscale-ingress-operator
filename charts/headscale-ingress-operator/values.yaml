replicaCount: 1

image:
  repository: ghcr.io/lucasilverentand/headscale-ingress-operator
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

config:
  interval: 30s
  allowedZones:
    - cluster.example

headscale:
  serverURL: ""
  namespace: headscale
  podSelector: app.kubernetes.io/name=headscale
  container: headscale
  recordsConfigMap: headscale-extra-records
  recordsKey: extra-records.json
  seedConfigMap:
    create: false
    keepOnUninstall: true

proxy:
  enabled: false
  headscaleUser: k8s-apps
  authKeyExpiration: 90d
  authKeyTags:
    - tag:cluster
  tailscaleImage: tailscale/tailscale:stable
  nginxImage: nginx:1.27-alpine
  defaultTLSSecret: ""
